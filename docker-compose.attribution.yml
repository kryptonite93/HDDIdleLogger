# Optional override: docker compose -f docker-compose.yml -f docker-compose.attribution.yml up -d
services:
  hdd-idle-profiler:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    environment:
      ATTRIBUTION_ENABLED: "true"
      ATTRIBUTION_IDLE_SECONDS: "60"
    volumes:
      - /sys/kernel/debug/tracing:/host/tracing:rw
      - /proc:/host/processes:ro
      - /var/lib/docker/containers:/host/docker-containers:ro
